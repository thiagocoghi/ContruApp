name: engin_app
description: EnginApp — Suíte Integrada de Gestão de Obras com IA On-Device.
publish_to: "none"
version: 0.1.0+1

environment:
  # PRD Seção 5: Android 10+ (API 29) / iOS 15+
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Estado (PRD 2.1: BLoC / Cubit) ─────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Banco de dados local (PRD 2.1: SQLite) ─────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3 # testes em desktop/CI
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Armazenamento de vetores (PRD 2.1) — decisão pendente ──────
  # sqlite-vec  (alternativa: objectbox, ver Seção 2.1 do PRD)
  # objectbox: ^4.0.1

  # ── Áudio / STT (Etapa 1: Whisper.cpp via FFI) ─────────────────
  record: ^6.2.1
  permission_handler: ^11.3.1
  # whisper.cpp v1.9.1 com bindings nativos Android/iOS (+ Windows p/ testes)
  whisper_ggml: ^2.8.1

  # ── Relatórios e compartilhamento (Etapa 1: RDO em PDF) ────────
  pdf: ^3.11.1
  share_plus: ^10.0.2
  intl: ^0.19.0

  # ── Processamento de imagem (Etapa 3: correção de perspectiva) ─
  image: ^4.2.0
  llamadart: ^0.16.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

# Runtime nativo do llamadart: só llama.cpp (GGUF). Sem isso o build embala
# também o LiteRT-LM (~30 MB por ABI) que o app não usa.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/normas/
    - assets/templates/
    - assets/imagens/
  # Modelos quantizados (~2,5 GB) ficam fora do bundle e são
  # baixados/carregados sob demanda — ver README.md